name: driver_location
description: "Delivery tracking module with live driver location."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  get: ^4.7.2

  # Map (no API key required - uses OpenStreetMap tiles)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Networking helper for tile loading
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
